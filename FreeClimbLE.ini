; FreeClimbLE.ini - afinacoes da escalada
; Escrito pelo menu do FreeClimb (MCM) e pelo proprio plugin. Pode editar a mao: e relido
; sozinho na proxima vez que se agarrar a uma parede. Unidades do Skyrim: 1 unidade ~ 1,4 cm.

[FreeClimb]

; ---- ESCALADA
; Ate onde procura a parede quando carrega em saltar (alcance).
Reach=110
; Distancia do personagem a parede enquanto agarrado (30 e a do mod original).
WallGap=30
; Distancia maxima a parede para se agarrar (o personagem e puxado ate ela).
AttachReach=65
; Alcance para apanhar uma parede a meio de um salto.
AirReach=90
; 1 = o salto junto a uma parede agarra-se sempre; 0 = passa por cima se for baixa.
AlwaysCling=1
; 0 = Salto sozinho junto a uma parede; 1 = Salto + W + A + D juntos (como o original).
EntryMode=0
; 1 = vira o personagem de frente para a parede.
FaceWall=1
; Altura minima (acima dos pes) de uma borda a passar por cima.
MinLedge=80
; Altura maxima de uma borda a passar por cima.
MaxLedge=180
; Altura da cabeca: onde se procura o topo da parede.
HeadHeight=125
; 1 = o controlador e teletransportado a cada atualizacao.
Warp=1

; ---- VELOCIDADE (0 = automatico: a velocidade do proprio clip)
; Subir (unidades por segundo). O original usa 100.
ClimbSpeed=0
; Descer. O original usa 78.
DownSpeed=0
; Andar de lado. O original usa 82.
SideSpeed=0
; Multiplica todas as velocidades automaticas.
SpeedScale=1
; Fracao da velocidade ao comecar a mexer (1 = sem rampa).
StartSpeed=0.45
; Segundos ate a velocidade completa.
RampSeconds=0.7
; Corrida na parede (Shift).
WallRunSpeed=379.5
; Multiplicador da corrida na diagonal.
WallRunDiagonal=1.15

; ---- SALTOS
; Multiplica a distancia dos saltos na parede.
HopScale=1.8
; Multiplica a velocidade dos saltos.
HopSpeed=1.1
; 1 = salto suave (comeca e acaba devagar).
HopEase=1
; 1 = mede a parede no destino; sem parede o salto sai normal e o personagem cai.
HopProbe=1
; 1 = salta sozinho para a parede seguinte quando a atual acaba.
ContextHops=1
; Velocidade da animacao de apanhar a parede.
CatchSpeed=1.5

; ---- SUAVIDADE E MOTOR DE POSE
; Suavidade da rotacao do corpo para a parede, em segundos (0 = instantaneo).
TurnSmooth=0.15
; Velocidade maxima de rotacao (graus por segundo).
TurnSpeed=540
; Suavidade da posicao ao mudar de parede, em segundos.
PosSmooth=0.1
; 1 = pose escrita antes da passagem do jogo (recomendado); 0 = modo antigo.
PoseMode=1
; Fusao ao entrar na pose da escalada (segundos).
EntryBlend=0.14
; Fusao ao sair da pose (segundos).
ExitBlend=0.22
; Fusao ao trocar de animacao (segundos).
MotionBlend=0.15
; Altura do corpo na corrida na parede (unidades).
RunHeight=0

; ---- ESTAMINA (percentagem da estamina maxima)
; Liga a estamina da escalada.
StaminaEnabled=1
; Custo por segundo agarrado parado.
StaminaHang=1
; Custo por segundo a subir.
StaminaClimb=3
; Custo por segundo a descer.
StaminaDown=1.5
; Custo por segundo a andar de lado.
StaminaSide=3
; Custo por segundo a correr na parede.
StaminaRun=8
; Custo de cada salto.
StaminaHop=6
; Custo de passar a borda.
StaminaMantle=4
; Multiplicador de dificuldade de todos os custos.
StaminaScale=1
; 1 = a regeneracao fica suspensa enquanto esta na parede.
StaminaBlockRegen=1
; Sem estamina, escorrega para baixo a esta velocidade (unidades/s).
StaminaSlideSpeed=25
; Percentagem de estamina para voltar a poder subir depois de esgotar.
StaminaResume=15

; ---- SONS
; Liga os sons da escalada (agarrar, passos, impulso, topo).
SoundEnabled=1
; Volume dos sons da escalada.
SoundVolume=1
; Intervalo minimo entre repeticoes do mesmo som (milissegundos).
SoundGapMs=140

; ---- COMANDO ANALOGICO
; Usa o analogico para direcao e velocidade continuas.
AnalogEnabled=1
; Zona morta do analogico (0 a 1).
AnalogDeadZone=0.25

; ---- MAOS E PES NA SUPERFICIE (raios)
; Ajusta maos e pes a superficie real (arvores, rochas, paredes irregulares).
SurfaceFit=1
; Orcamento de raios por atualizacao (mais = mais preciso, mais pesado).
FitRays=4
; Abaixo destes fps o ajuste usa menos raios sozinho.
FitMinFps=35

; ---- SEGUIDOR (experimental)
; O seguidor escolhido no FreeRun (F11) escala ao seu lado.
FollowerEnabled=0
; Distancia lateral do seguidor a si na parede (unidades).
FollowerOffset=90

; ---- MENU E DIAGNOSTICO
; Idioma do menu: 0 = English, 1 = Portugues.
Language=0
; 1 = registo detalhado (o log fica grande).
Verbose=0
